name: CI (Go)

# Go CI for this repository. Standard toolchain only: gofmt, go vet, go test,
# go build -- no third-party linters, so it runs on any Go project unchanged.
# The gui-tagged widget tree is tested here too, headless (Fyne's `ci` tag),
# so it needs no toolkit installed.
# `go.sum` is the lockfile; `go` downloads exactly what it pins, so there is no
# separate locked-install step to get wrong.
#
# It runs on release pull requests (`dev` -> `main`) and on manual dispatch --
# never on a feature-branch pull request. Feature branches are gated locally by
# `make check`.

on:
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  go:
    # The job name is the status check's name. Without an explicit one
    # it defaults to the job id, 'go' -- and a required status check that
    # names 'CI (Go)' would never match it, leaving every release pull
    # request blocked forever with no failing check to show for it.
    name: CI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # `go-version-file` keeps CI and local development on the same
          # toolchain. Pin the version in go.mod, not in two places.
          go-version-file: 'go.mod'
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The gui-tagged widget tree, headless. Fyne's `ci` tag swaps the GL
      # driver for the software one, so this needs no GTK/X11/GL and runs in
      # this job rather than the release-time GUI build. It is the step that
      # proves a transfer row and an inline image, not just that the package
      # compiles.
      - name: Test the GUI headless
        run: CGO_ENABLED=0 go test -tags "gui ci" ./ui/... ./cmd/ui/...

      # The race detector, on the non-GUI build. It is a separate step rather
      # than part of `make check` because it needs cgo; the GUI suite is left
      # out on purpose, and the Makefile's `race` target says why (Fyne's test
      # driver runs fyne.Do inline, so the detector would report the harness).
      - name: Test with the race detector
        run: make race

      # A short fuzz pass over the parsers that read bytes from a peer. Twenty
      # seconds each is not a proof; the value is that a regression is found by
      # the job rather than by a user, and that a failing input is committed to
      # testdata/fuzz and replayed by every later run.
      - name: Fuzz the wire parsers
        run: make fuzz FUZZTIME=20s

      - name: Build
        run: go build ./...

      # A file behind `//go:build windows` is not compiled by the Linux build
      # above, so an unused import there passed CI and failed the Windows jobs
      # in release.yml (#176). Compile that tree here; the native Fyne link
      # still belongs to the release workflow.
      - name: Cross-compile for Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...

# A `paths:` filter that the change does not touch means this workflow does not
# trigger at all, and a triggered run whose jobs are all gated out reports
# `skipped`, not `passed`. Skipped is not passed: run `make check` locally
# before relying on CI.
#
# COVERAGE IS PARTIAL. `go test ./...` prints "[no test files]" for the packages
# without a test file and still exits 0, so a green `Test` step means "the
# packages compiled and the tested ones passed" — not "everything was executed".
# `make check` prints the list of uncovered packages for the same reason. Read
# the run's log before treating a green build as coverage.
#
# `Test the GUI headless` is a separate step because `go test ./...` does not
# include the gui-tagged package: without it, the widget tree would only be
# compiled by the release-time GUI jobs and never executed.
#
# Each stage above is its own step, so a non-zero exit fails the job: unlike the
# `check` target, nothing here is chained with `;` behind a final `if`.
