name: Release draft

# Builds every release asset and creates a DRAFT GitHub release for a human to
# review and publish. It never publishes and never pushes a tag: the tag is
# created by GitHub when the draft is published by hand.
#
# Manual dispatch only (`workflow_dispatch`), and only from `main` — the
# release is the merge of `dev` into `main`, so a build from any other ref is
# not a release and is refused in the first job.
#
# Asset matrix:
#
#   CLI  `make release`          Windows amd64, Linux amd64, Android arm64,
#                                macOS arm64 + amd64        (ubuntu-latest)
#   GUI  `make gui-linux`        Linux amd64                (ubuntu-latest)
#   GUI  `make gui-windows`      Windows amd64, cross-built (ubuntu-latest)
#   GUI  `make gui-darwin`       macOS arm64                (macos-latest)
#   APP  `make gui-android`      Android arm64 APK          (ubuntu-latest)
#
# The GUI targets need CGO and platform headers, so each one runs on the runner
# that can provide them. None of them can be built in the dev sandbox, which is
# why local verification of this workflow stops at `make check` plus a dry run
# of the CLI targets.
#
# A skipped or failed job must never leave a partial draft behind: `draft`
# depends on every build job, and it refuses to add assets to a release that is
# already published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. v0.2.0 — creates a DRAFT release; nothing is published'
        required: true
        type: string

# One release at a time per version. `cancel-in-progress: false` is deliberate:
# a cancelled run can leave a half-uploaded draft, and a half-uploaded draft
# looks complete from the release page.
concurrency:
  group: release-draft-${{ inputs.version }}
  cancel-in-progress: false

# Creating a draft release and uploading assets needs write access to contents.
permissions:
  contents: write

env:
  # Injected into the binary by every Makefile target; the archive names use the
  # same value. Passed with `make VERSION=...` because the Makefile's own
  # default comes from `git describe`, which a shallow checkout cannot answer.
  VERSION: ${{ inputs.version }}

jobs:
  # ---------------------------------------------------------------------------
  # Guard rails: a well-formed version, from `main`, ahead of any build.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to build a release from anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::a release must be built from main, not '$REF' — merge dev into main first"
            exit 1
          fi

      - name: Check the version format
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$REQUESTED' is not a version — expected v<major>.<minor>.<patch>, e.g. v0.2.0"
            exit 1
          fi
          echo "building $REQUESTED"

  # ---------------------------------------------------------------------------
  # The gate. A draft is never created from a tree that fails `make check`.
  #
  # What this proves: gofmt-clean, `go vet` clean, the tested packages pass, and
  # everything compiles (the GUI package compiles with its no-op stub, because
  # `check` does not use `-tags gui`). It does NOT prove behaviour of packages
  # without tests — `make check` prints that list, read it.
  # ---------------------------------------------------------------------------
  gate:
    name: Gate (make check)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: make check
        run: make check

  # ---------------------------------------------------------------------------
  # CLI archives: `make release` — Windows, Linux, Android and macOS, all pure
  # Go, so one Linux runner builds all of them.
  # ---------------------------------------------------------------------------
  build-cli:
    name: CLI (windows, linux, android, darwin)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure zip is available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zip
          fi

      - name: make release
        run: make release VERSION="$VERSION"

      - name: Upload the CLI archives
        uses: actions/upload-artifact@v7
        with:
          name: cli-assets
          path: |
            build/**/*.zip
            build/**/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # GUI, Linux: Fyne links against GTK3, GL and the X11/XRandR/XInput headers.
  # ---------------------------------------------------------------------------
  gui-linux:
    name: GUI (linux/amd64)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install the Fyne build headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc pkg-config zip \
            libgl1-mesa-dev libgtk-3-dev libxkbcommon-dev xorg-dev

      - name: make gui-linux
        run: make gui-linux VERSION="$VERSION"

      # The window icon is embedded in the binary, and the only icon file on
      # disk is the one add_to_path.sh writes at install time. So the archive
      # must carry none — a PNG next to the binaries is read by nothing — and
      # the menu entry must name the GUI binary, because the archive's
      # `cthrone` is the command-line tool that only prints "GUI not built".
      - name: Check the archive carries no loose icon files
        run: |
          status=0
          for archive in build/GUI/*_linux_gui_amd64.tar.gz; do
            listing=$(tar tzf "$archive")
            if printf '%s\n' "$listing" | grep -Ei '\.(png|ico|icns)$'; then
              echo "error: $archive ships an icon file — the icon belongs in the binary, and add_to_path.sh writes the launcher copy" >&2
              status=1
            else
              echo "ok: $archive ships no loose icon file"
            fi
            for member in cthrone_gui add_to_path.sh cthrone.desktop; do
              if printf '%s\n' "$listing" | grep -qx "$member"; then
                echo "ok: $archive lists $member"
              else
                echo "error: $archive does not list $member" >&2
                status=1
              fi
            done
            if tar xzOf "$archive" cthrone.desktop | grep -qx 'Exec=cthrone_gui'; then
              echo "ok: the menu entry runs cthrone_gui"
            else
              echo "error: cthrone.desktop does not run cthrone_gui — the menu entry would print \"GUI not built\" and exit 0" >&2
              status=1
            fi
          done
          exit $status

      - name: Upload the Linux GUI archive
        uses: actions/upload-artifact@v7
        with:
          name: gui-linux-assets
          path: build/GUI/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # GUI, Windows: cross-compiled from Linux with mingw-w64. If this job fails
  # with a glfw/link error, the fallback is a native `windows-latest` job — see
  # the issue that added this workflow.
  # ---------------------------------------------------------------------------
  gui-windows:
    name: GUI (windows/amd64)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install the mingw-w64 cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip unzip

      - name: make gui-windows
        run: make gui-windows VERSION="$VERSION"

      # The icon is a PE resource, so its absence is invisible until someone
      # opens Explorer on Windows — and so is its accidental spread to the CLI
      # exes, which need none. Check both directions here, plus the archive: a
      # loose .ico is never read by Windows, so shipping one is only bloat.
      - name: Check the icon reaches cthrone_gui.exe and nothing else
        run: |
          status=0
          gui=build/GUI/Windows/cthrone_gui.exe
          if x86_64-w64-mingw32-objdump -h "$gui" | grep -q '\.rsrc'; then
            echo "ok: $gui carries the icon resource"
          else
            echo "error: $gui carries no .rsrc section — the icon is missing" >&2
            status=1
          fi
          for cli in build/GUI/Windows/cthrone.exe build/GUI/Windows/ct.exe; do
            if x86_64-w64-mingw32-objdump -h "$cli" | grep -q '\.rsrc'; then
              echo "error: $cli carries a .rsrc section — the CLI needs no icon" >&2
              status=1
            else
              echo "ok: $cli carries no icon resource"
            fi
          done
          for archive in build/GUI/Windows/*_windows_gui_amd64.zip; do
            if unzip -l "$archive" | grep -qi '\.ico$'; then
              echo "error: $archive ships a loose .ico — Windows never reads it" >&2
              status=1
            else
              echo "ok: $archive ships no loose .ico"
            fi
          done
          exit $status

      # The subsystem decides whether Windows gives the process a console, and
      # getting it wrong is silent: a GUI-subsystem CLI exe shows nothing when
      # double-clicked, lets cmd return before it finishes, and swallows every
      # log line. The GUI exe wants 2 (no console flashing behind the window),
      # the two CLI exes want 3.
      - name: Check the exe subsystems
        run: |
          status=0
          subsystem() {
            x86_64-w64-mingw32-objdump -p "$1" | awk '$1 == "Subsystem" { print $2; exit }'
          }
          check() {
            file="$1"
            want="$2"
            name="$3"
            got="$(subsystem "$file")"
            if [ "$got" = "$want" ]; then
              echo "ok: $file is the $name subsystem ($got)"
            else
              echo "error: $file is subsystem ${got:-unknown}, want $want ($name)" >&2
              status=1
            fi
          }
          check build/GUI/Windows/cthrone_gui.exe 00000002 GUI
          check build/GUI/Windows/cthrone.exe 00000003 console
          check build/GUI/Windows/ct.exe 00000003 console
          exit $status

      - name: Upload the Windows GUI archive
        uses: actions/upload-artifact@v7
        with:
          name: gui-windows-assets
          path: build/GUI/*.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # GUI, macOS: must be native. The target refuses to run anywhere else, so a
  # mismatch fails loudly instead of producing a Linux binary in a darwin zip.
  # ---------------------------------------------------------------------------
  gui-darwin:
    name: GUI (darwin/arm64)
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: make gui-darwin
        run: make gui-darwin VERSION="$VERSION"

      # Finder reads an .icns inside a .app bundle, never a PNG beside the
      # binary, and the window icon comes from the embedded copy — so an icon
      # file in this archive is dead weight.
      - name: Check the archive carries no loose icon files
        run: |
          status=0
          for archive in build/GUI/*_darwin_gui_arm64.tar.gz; do
            if tar tzf "$archive" | grep -Ei '\.(png|ico|icns)$'; then
              echo "error: $archive ships an icon file — nothing on macOS reads it" >&2
              status=1
            else
              echo "ok: $archive ships no loose icon file"
            fi
          done
          exit $status

      - name: Upload the macOS GUI archive
        uses: actions/upload-artifact@v7
        with:
          name: gui-darwin-assets
          path: build/GUI/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Android app: the Fyne GUI packaged as an installable APK.
  #
  # `make gui-android` runs `fyne package -target android/arm64` without
  # `--release`, which signs with the packager's bundled debug key. That is the
  # signature a sideload accepts; `--release` would emit an .aab that only a
  # store or bundletool can install.
  #
  # The GitHub runner image carries the Android SDK (with build-tools, so
  # `aapt2` is there) and one or more NDKs; the Makefile finds the NDK under
  # $ANDROID_HOME/ndk when ANDROID_NDK_HOME is not exported.
  # ---------------------------------------------------------------------------
  gui-android:
    name: App (android/arm64 APK)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install the fyne CLI
        # Mirrors FYNE_CLI_VERSION in the Makefile: the packager shapes the
        # manifest and the signature, so an unpinned upgrade changes the APK.
        run: |
          GOTOOLCHAIN=go1.24.5 go install fyne.io/tools/cmd/fyne@v1.26.1 || GOTOOLCHAIN=auto go install fyne.io/tools/cmd/fyne@v1.26.1 || go install fyne.io/tools/cmd/fyne@latest

      - name: make gui-android
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make gui-android VERSION="$VERSION" && \
          echo "---" && \
          unzip -p build/GUI/*.apk AndroidManifest.xml | head -80

      - name: Verify the APK
        run: |
          set -euo pipefail
          apk="$(ls build/GUI/*.apk)"
          echo "built $apk"
          file "$apk"
          unzip -l "$apk" | grep -q 'AndroidManifest.xml' \
            || { echo "::error::$apk has no AndroidManifest.xml — not an APK"; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/' \
            || { echo "::error::$apk carries no arm64 native library — the Go payload is missing"; exit 1; }

      - name: Upload the Android APK
        uses: actions/upload-artifact@v7
        with:
          name: gui-android-assets
          path: build/GUI/*.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The draft. Every archive in one flat directory (release asset names are
  # flat), a checksum file over all of them, a curated description followed by
  # a changelog built from the merged pull requests, and
  # `gh release create --draft`.
  # ---------------------------------------------------------------------------
  draft:
    name: Draft release
    needs: [build-cli, gui-linux, gui-windows, gui-darwin, gui-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Collect the assets
        uses: actions/download-artifact@v8
        with:
          pattern: '*-assets'
          path: downloaded
          merge-multiple: true

      # `upload-artifact` keeps the path below the search root, so the archives
      # arrive under `downloaded/Windows/`, `downloaded/Linux/` and friends.
      # Release assets are flat, so flatten them here — one place, rather than
      # a `find -maxdepth 1` that silently matches nothing.
      - name: Flatten into one asset directory
        run: |
          set -euo pipefail
          mkdir -p assets
          find downloaded -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -exec cp -v {} assets/ \;
          echo "collected $(find assets -maxdepth 1 -type f | wc -l) archives"

      - name: Write checksums.txt
        run: |
          set -euo pipefail
          cd assets
          mapfile -t archives < <(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -printf '%f\n' | sort)
          if [ "${#archives[@]}" -lt 10 ]; then
            echo "::error::expected at least 10 archives, found ${#archives[@]}: ${archives[*]}"
            exit 1
          fi
          sha256sum "${archives[@]}" > checksums.txt
          cat checksums.txt

      - name: Compose the release description
        env:
          # `gh` refuses to authenticate without this, and the compose step
          # calls the releases and pull-request APIs through
          # `scripts/release-notes.sh`. Without it the step still succeeds — it
          # falls back to a pointer at the commit list — so the loss is silent
          # unless the token is set here.
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Quoted heredoc: backticks and `$(...)` in the Markdown stay literal.
          # @PLACEHOLDER@ tokens are substituted below.
          cat > header.md <<'EOF'
          ## 💬 cthrone @VERSION@

          Chat from one device to another — a terminal, a desktop window, or a
          phone. One device **hosts**, the others connect; there is no account and
          no server, and every session is sealed end to end.

          Built from `@COMMIT@` · [workflow run](@RUN@)

          ## 📦 Download

          | | Platform | Asset |
          |:--:|---|---|
          | 🐧 | **Linux** | `cthrone_@VERSION@_linux.tar.gz` |
          | 🐧 | Linux, with the window | `cthrone_@VERSION@_linux_gui_amd64.tar.gz` |
          | 🪟 | **Windows** | `cthrone_@VERSION@_windows.zip` |
          | 🪟 | Windows, with the window | `cthrone_@VERSION@_windows_gui_amd64.zip` |
          | 🍎 | **macOS**, Apple silicon | `cthrone_@VERSION@_darwin_arm64.tar.gz` |
          | 🍎 | macOS, with the window | `cthrone_@VERSION@_darwin_gui_arm64.tar.gz` |
          | 🍎 | macOS, Intel | `cthrone_@VERSION@_darwin_amd64.tar.gz` |
          | 🤖 | **Android app** | `cthrone_@VERSION@_android_gui_arm64.apk` |
          | 🤖 | Android CLI (Termux) | `cthrone_@VERSION@_android.zip` |

          Every CLI archive carries `cthrone` and the short alias `ct`: unpack it and
          run `add_to_path.sh` (or `.bat`) once. The window archives are the same
          tool with the GUI built in; on Linux they need the GTK3, OpenGL and X11
          runtime libraries. The APK is **debug-signed** — tap it and allow the
          install once.

          ## ✅ Verify

          ```sh
          sha256sum -c checksums.txt        # macOS: shasum -a 256 -c checksums.txt
          ```

          ## 🔒 Security

          Every session is **sealed and authenticated end to end** — X25519, HKDF
          per direction, AES-256-GCM — and the peer's device key is pinned on first
          contact. The websocket is `wss://` by default and the host's certificate
          is pinned too; `--no-tls` is the opt-out, kept for a peer that predates
          the current protocol.

          ## ⚠️ What this build does not do

          - **Only WAV and MP3 play inside the app.** Those two play on the file's
            own row; Ogg/Vorbis, AAC/M4A and FLAC have no decoder in this build,
            so they open with another app — the system app on a desktop, the
            browser on a phone.
          - **PDFs are not drawn**: they open with the device's viewer on a
            desktop, and in the browser on a phone.
          - **An animated GIF plays; a video does not.** GIFs play on their row with
            a seek bar. MP4, H.264 and WebM need a codec this build does not carry,
            so those open with the device's player — the system app on a desktop,
            the browser on a phone. The plan is on the wiki's
            [Video in the app](https://github.com/fiwon123/cthrone/blob/main/docs/wiki/Video-in-the-app.md)
            page.
          - **`recv`/`exec` are not implemented.**
          - The **Windows Bluetooth transport**, the **phone build** and the
            **APK on a device** have not been run yet. Nothing here has been
            heard on a phone either: the in-app player is compiled into the APK
            and has never been run on one.
          - **Opening a file on a phone has not been tried on a device.** It serves
            the file to the browser over a loopback link; the steps and where to
            report are in
            [Verifying on real hardware](https://github.com/fiwon123/cthrone/blob/main/docs/wiki/Verifying-on-real-hardware.md)
            under "Opening a file on a phone". Until that result, treat it as
            unproven.

          Each of those has an issue, and the wiki's
          [Verifying on real hardware](https://github.com/fiwon123/cthrone/blob/main/docs/wiki/Verifying-on-real-hardware.md)
          page has the steps, what to record, and where to report it.

          <details>
          <summary>🧾 Every change</summary>

          EOF

          sed -i "s|@VERSION@|$VERSION|g; s|@COMMIT@|$COMMIT|g; s|@RUN@|$RUN_URL|g" header.md

          # A value typed into the prose instead of interpolated goes stale as
          # soon as the next release is cut: the published v0.8.0 body told
          # readers about a host from the release before it (#141). Only two
          # versions may appear in the rendered header — the one being built,
          # and the compatibility peer — and a surviving @PLACEHOLDER@ means a
          # misspelt token would ship verbatim. Either one fails the job rather
          # than the release page.
          if grep -nE '@[A-Z_]+@' header.md; then
            echo "::error::header.md still carries an unsubstituted placeholder — use @VERSION@, @COMMIT@ or @RUN@"
            exit 1
          fi

          stray="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' header.md | grep -vxF -e "$VERSION" -e "v0.6.0" || true)"
          if [ -n "$stray" ]; then
            echo "::error::a release version is typed into the header: $(printf '%s\n' "$stray" | sort -u | tr '\n' ' ')— use @VERSION@; v0.6.0 is the only literal (the compatibility peer)"
            exit 1
          fi

          # `releases/generate-notes` walks the commit graph from the previous
          # release tag to this commit, so a squash-merged release PR leaves
          # every feature commit on `dev` and the notes list only that PR.
          # `scripts/release-notes.sh` lists the pull requests instead (#130).
          if ./scripts/release-notes.sh "$REPO" "$VERSION" "$COMMIT" > changes.md 2>release-notes.err; then
            :
          else
            echo "::warning::release-notes.sh failed; shipping the curated header only"
            sed 's/^/  /' release-notes.err >&2
            printf '_Automatic release notes were unavailable for %s. See the full commit list:\n%s/commits/%s_\n' \
              "$VERSION" "$GITHUB_SERVER_URL/$REPO" "$COMMIT" > changes.md
          fi

          # The changelog is folded under the summary the header opened, so the
          # page reads as a product page first and a commit list second.
          { cat header.md; cat changes.md; printf '\n</details>\n'; } > release-notes.md
          wc -l release-notes.md

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t files < <(cd assets && find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -printf 'assets/%f\n' | sort)
          files+=(assets/checksums.txt)
          echo "uploading ${#files[@]} assets"

          # `gh release view` fails (non-zero) when no release exists yet.
          state="$(gh release view "$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || true)"

          case "$state" in
            true)
              # A previous run left a draft: refresh it instead of failing, so
              # re-running after a fix is one click and not a manual cleanup.
              echo "draft $VERSION exists — updating description and assets"
              gh release edit "$VERSION" --title "cthrone $VERSION" --notes-file release-notes.md --draft
              gh release upload "$VERSION" "${files[@]}" --clobber
              ;;
            false)
              echo "::error::release $VERSION is already published — refusing to touch it"
              echo "Pick a new version, or delete the published release by hand."
              exit 1
              ;;
            *)
              echo "creating draft $VERSION"
              # No tag is pushed here: `--target` records the commit, and
              # GitHub creates the tag when the draft is published by hand.
              gh release create "$VERSION" \
                --draft \
                --title "cthrone $VERSION" \
                --notes-file release-notes.md \
                --target "$COMMIT" \
                "${files[@]}"
              ;;
          esac

      - name: Report
        run: |
          set -euo pipefail
          {
            echo "### Draft release: $VERSION"
            echo
            echo "Review it on the [releases page](${{ github.server_url }}/${{ github.repository }}/releases) — it stays a draft until a human publishes it."
            echo
            echo "No tag exists yet; publishing the draft creates it from this commit."
            gh release view "$VERSION" --json url,isDraft,assets \
              --jq '"assets: \(.assets | length) · draft: \(.isDraft) · \(.url)"' || true
          } >> "$GITHUB_STEP_SUMMARY"
