# Optional overlay: host-only mounts for the in-container AI agents.
#
# NOT part of the default stack, and deliberately not referenced by
# `docker-compose.yml`. Merge it explicitly:
#
#     docker compose -f docker-compose.yml -f docker-compose.agent.yml up -d dev
#
# The POSIX Makefile and `scripts/dev-up.py` do this for you, after creating
# every mount source below so none of them is missing.
#
# Why these mounts live here instead of the base file: every path is a
# HOST path that a demo user does not have. Compose treats a missing bind-mount
# source as a hard failure on Windows and creates a root-owned directory for it
# on Linux, so shipping them in the base file means a single absent
# `~/.config/gh` breaks `docker compose up` for a reader who only wanted to see
# the project run.
#
# What is NOT here, on purpose:
#
#   - The agents themselves. opencode, Claude Code and Codex are installed in
#     the image (see Dockerfile.template), so they run on any host OS and never
#     share a binary with the host.
#   - The agents' logins. Each agent asks for its own on first run and keeps it
#     in a named volume declared in docker-compose.yml — inside Docker, isolated
#     from the host's logins and from every other project's.
#   - The Docker socket. It is RW-by-definition and grants the agent
#     container-management rights over the host.

services:
  dev:
    volumes:
      - ${HOST_HOME:-${HOME}}/.config/gh:/home/devuser/.config/gh:ro
      - ${HOST_HOME:-${HOME}}/.gitconfig:/home/devuser/.gitconfig:ro
