# The NATS broker of the dev sandbox.
#
# Chat traffic is not persisted: JetStream is off on purpose, so a
# conversation does not outlive the session it happened in, and the broker
# keeps nothing that has to be cleaned up.
#
# The broker asks for credentials. They are not in this file: the server
# reads them from the environment, so the same file works with any
# password and the password never has to be committed.
#
# The server reads the value as a configuration value, so a password with
# a "#" or a quote in it does not survive the trip. Keep the dev password
# to letters, digits and dashes.
port: 4222

# The monitoring endpoint, the same port the compose file publishes.
http: 8222

authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
}
